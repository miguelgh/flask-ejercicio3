<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="/static/css/estilos.css">
    <title>Ejercicio 2</title>
</head>
<body>
    <div>
        <h1>Ejercicio 2</h1>
    </div>
    <div class="formulario">
        <form action="/ejercicio2" method="post">
            <label for="nombre1">Nombre 1:</label>
            <input type="text" name="nombre1" id="nombre1">
            <label for="nombre2">Nombre 2:</label>
            <input type="text" name="nombre2" id="nombre2">
            <label for="nombre3">Nombre 3:</label>
            <input type="text" name="nombre3" id="nombre3">
            <br>
            <button type="submit" class="boton enviar">Enviar</button>
        </form>
        {% if mayorNombre %}
        <div>
            <p>El nombre con mayor cantidad de caracteres es: {{mayorNombre}} <br>
                El nombre tiene {{cantidad}} de caracteres.
            </p>
        </div>
        {% elif iguales %}
        <div>
            <p>Los nombres tienen la misma cantidad de caracteres o hay dos nombres con la misma cantidad</p>
        </div>
        {% endif %}
    </div>

    <div class="volver">
        <a href="/">Volver al inicio</a>
    </div>
</body>
</html>
